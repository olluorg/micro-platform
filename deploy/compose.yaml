# Production compose for the VPS. Lives at /opt/ollu/compose.yaml.
# OLLU_IMAGE is injected per-deploy via .env.deploy (the pinned GHCR tag);
# GOOGLE_AUDIENCES / RUST_LOG come from the operator-managed .env.
services:
  ollu-server:
    image: ${OLLU_IMAGE}
    restart: unless-stopped
    environment:
      # The container listens on all interfaces *inside* the container;
      # host exposure is restricted to loopback by the port mapping below.
      BIND: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/ollu.db
      RUST_LOG: ${RUST_LOG:-info}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
    ports:
      # Reverse proxy terminates TLS on the host and forwards here.
      # Loopback-only — the server is never reachable directly from the internet.
      # Host port is configurable (HOST_PORT) to avoid clashes on the VPS.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - ollu-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  ollu-data:
