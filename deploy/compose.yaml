# Production compose for the VPS. Lives at /opt/ollu/compose.yaml.
# OLLU_IMAGE / GOOGLE_AUDIENCES / RUST_LOG / HOST_PORT come from /opt/ollu/.env,
# which the deploy workflow renders from GitHub Variables/Secrets each run.
services:
  ollu-server:
    image: ${OLLU_IMAGE}
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/ollu.db
      RUST_LOG: ${RUST_LOG:-info}
      GOOGLE_AUDIENCES: ${GOOGLE_AUDIENCES:-}
    ports:
      # Loopback-only publish, used by the deploy smoke test. The reverse proxy
      # does NOT use this — it reaches the container by name over the shared
      # network below (http://ollu-server:8080), so nothing is internet-facing.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    networks:
      - proxy
    volumes:
      - ollu-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Nginx Proxy Manager's network — proxy by container name on http://ollu-server:8080.
networks:
  proxy:
    external: true
    name: proxy-manager_default

volumes:
  ollu-data:
