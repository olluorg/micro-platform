name: Deploy server

on:
  push:
    tags:
      - "server-v*" # decoupled from the SDK release tag (v*) in release.yml
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image refs
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/$owner/ollu-server"
          tag="${GITHUB_REF_NAME//\//-}" # tag name, or branch for workflow_dispatch
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/compose.yaml"
          target: "/opt/ollu"
          strip_components: 1

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # App config — single source of truth in GitHub (Variables/Secrets).
          GOOGLE_AUDIENCES: ${{ vars.GOOGLE_AUDIENCES }}
          RUST_LOG: ${{ vars.RUST_LOG || 'info' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,GOOGLE_AUDIENCES,RUST_LOG
          script: |
            set -euo pipefail
            mkdir -p /opt/ollu
            cd /opt/ollu
            # Render the compose env file from GitHub config on every deploy.
            # OLLU_IMAGE is the pinned tag for this run.
            cat > .env <<EOF
            OLLU_IMAGE=${IMAGE}
            GOOGLE_AUDIENCES=${GOOGLE_AUDIENCES}
            RUST_LOG=${RUST_LOG}
            EOF
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose --env-file .env pull
            docker compose --env-file .env up -d
            docker image prune -f
            # Smoke test against the loopback-published port.
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8080/healthz; then echo " OK"; exit 0; fi
              sleep 2
            done
            echo "healthz did not come up" >&2
            docker compose logs --tail=50 ollu-server >&2
            exit 1
