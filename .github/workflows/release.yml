name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release tarballs
        env:
          REPO: ${{ github.repository }}
        run: ./scripts/release.sh "${{ steps.ver.outputs.version }}"

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Auto-generated release ${TAG}. Install in a consumer with:

          \`\`\`
          bun add https://github.com/${REPO}/releases/download/${TAG}/ollu-shared-types-${VERSION}.tgz
          bun add https://github.com/${REPO}/releases/download/${TAG}/ollu-sdk-core-${VERSION}.tgz
          bun add https://github.com/${REPO}/releases/download/${TAG}/ollu-sdk-idb-${VERSION}.tgz
          bun add https://github.com/${REPO}/releases/download/${TAG}/ollu-sdk-backup-gdrive-${VERSION}.tgz
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            dist-release/*.tgz \
            --title "${TAG}" \
            --notes-file release-notes.md
